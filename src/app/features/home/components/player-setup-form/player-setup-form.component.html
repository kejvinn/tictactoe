<div formGroupName="playerSetup">
  <label for="player1Name">Player 1</label>
  <input id="player1Name" type="text" formControlName="player1Name" />
  <p>{{ nameError('player1Name') }}</p>

  <label for="player2Name">Player 2</label>
  <input id="player2Name" type="text" formControlName="player2Name" />
  <p>{{ nameError('player2Name') }}</p>

  <button type="button" [disabled]="playerSetup.invalid" (click)="setup.goTo('pre-game')">Next</button>
</div>
