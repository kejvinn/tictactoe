<div formGroupName="preGame">
  <fieldset>
    <legend>Player 1 mark</legend>
    @for (mark of marks; track mark) {
      <label [class]="'mark-' + mark">
        <input type="radio" formControlName="player1Mark" [value]="mark" />
        {{ mark }}
      </label>
    }
  </fieldset>

  <fieldset>
    <legend>Player 2 mark</legend>
    @for (mark of marks; track mark) {
      <label [class]="'mark-' + mark">
        <input type="radio" formControlName="player2Mark" [value]="mark" />
        {{ mark }}
      </label>
    }
  </fieldset>

  <fieldset>
    <legend>Number of games</legend>
    @for (count of gameCounts; track count) {
      <label>
        <input type="radio" formControlName="totalGames" [value]="count" /> Best of {{ count }}
      </label>
    }
    <p>{{ totalGamesError() }}</p>
  </fieldset>

  <button type="submit">Start tournament</button>
</div>
