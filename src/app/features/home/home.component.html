<div class="home-container">
  <div class="home-content">
    <h1>Welcome to Tic Tac Toe Tournament!</h1>
    <p>
      Get ready to challenge your friends and compete for the ultimate title of Tic Tac Toe
      champion!
    </p>

    <form [formGroup]="setupForm" (ngSubmit)="onSubmit()">
      <app-form-container>
        @switch (setup.setupStep()) {
          @case ('local') {
            <app-local-form />
          }
          @case ('pre-game') {
            <app-pre-game-form />
          }
        }
      </app-form-container>
    </form>
  </div>
</div>
