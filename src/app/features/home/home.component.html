<div class="home-container">
  <div class="home-content">
    <h1>Tic Tac Toe!</h1>
    <form [formGroup]="setupForm" (ngSubmit)="onSubmit()">
      <app-form-container>
        @switch (setup.setupStep()) {
          @case ('player-setup') {
            <app-player-setup-form />
          }
          @case ('pre-game') {
            <app-pre-game-form />
          }
        }
      </app-form-container>
    </form>

    <button type="button" (click)="leaderboardOpen.set(true)">Leaderboard</button>

    <app-modal heading="Leaderboard" [(open)]="leaderboardOpen">
      @if (leaderboardOpen()) {
        <app-leaderboard />
        <a routerLink="/leaderboard">Open full page</a>
      }
    </app-modal>
  </div>
</div>
