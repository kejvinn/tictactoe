@if (store.players(); as players) {
  <app-scoreboard
    [players]="players"
    [scores]="store.scores()"
    [progressLabel]="store.progressLabel()"
  />

  <p
    [class.over]="store.isRoundOver()"
    [class.x]="store.roundWinner() === 'X'"
    [class.o]="store.roundWinner() === 'O'"
  >
    {{ status() }}
  </p>

  <app-board
    [board]="store.board()"
    [winningLine]="store.winningLine()"
    [locked]="store.isRoundOver()"
    (cellSelected)="store.play($event)"
  />

  @if (showNextGame()) {
    <button type="button" (click)="store.nextGame()">Next game</button>
  }

  @if (store.isTournamentOver()) {
    <button type="button" (click)="resultsOpen.set(true)">Show results</button>
  }

  <button type="button" (click)="leaderboardOpen.set(true)">Leaderboard</button>

  <app-modal heading="Leaderboard" [(open)]="leaderboardOpen">
    @if (leaderboardOpen()) {
      <app-leaderboard />
    }
  </app-modal>

  <app-modal heading="Tournament results" [(open)]="resultsOpen">
    <app-results
      [players]="players"
      [results]="store.results()"
      [scores]="store.scores()"
      [winner]="store.tournamentWinner()"
      (playAgain)="playAgain()"
    />
  </app-modal>
}
